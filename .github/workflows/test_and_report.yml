name: SymptoCare Test Automation and Execution Report

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  test-and-report:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Report Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas openpyxl

    - name: Run Test Suite and Generate Report
      run: |
        python tests/run_all_tests.py

    - name: Publish Test Dashboard to Job Summary
      run: |
        cat github_summary.md >> $GITHUB_STEP_SUMMARY
        cat ci_test_summary.md >> $GITHUB_STEP_SUMMARY

    - name: Upload Excel Test Report Artifact
      uses: actions/upload-artifact@v4
      with:
        name: test-execution-report
        path: test_report.xlsx
        retention-days: 30
